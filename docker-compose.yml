services:
  url-shortener:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "http://localhost:8080"
      DATABASE_PATH: "/data/urls.sqlite3"
      ASSET_DIR: "/app/dist"
    volumes:
      - url-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  url-data:
